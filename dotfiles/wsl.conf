[boot]
# systemd=true makes WSL boot the distro with systemd as PID 1,
# so systemctl works normally (services, sockets, timers).
systemd=true

[automount]
# Mounts Windows drives (C:, D:, ...) into the Linux filesystem.
enabled=true
root=/mnt

# metadata -> the classic fix: without it every file on /mnt/c shows up as
# root:root and chmod/chown silently do nothing. With it, Linux perms are
# stored as NTFS xattrs and actually stick.
# umask=22 (dirs 755) / fmask=11 (files 644) -> sane, readable-by-all perms.
options="metadata,umask=22,fmask=11"

# Also mount entries listed in /etc/fstab on top of the auto mounts.
mountFsTab=true

[network]
# Rebuild /etc/hosts and /etc/resolv.conf from Windows every boot,
# so DNS/hostname track the Windows side and don't break after changes.
generateHosts=true
generateResolvConf=true

[interop]
# Lets WSL launch Windows .exe programs and gives you Windows PATH inside
# Linux (wsl.exe, explorer.exe, code, etc. just work).
enabled=true
appendWindowsPath=true