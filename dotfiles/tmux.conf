   	 	# Enable mouse support
		set -g mouse on

		# Always let tmux handle text selection on drag, even over TUI apps like opencode
		#bind -n MouseDrag1Pane if-shell -F '#{pane_in_mode}' 'send-keys -M' 'copy-mode -M'


        #bind -n DoubleClick1Pane {
        #    select-pane
        #    copy-mode -M
        #    send-keys -X select-word
        #    run -d0.3
        #    send-keys -X copy-pipe-and-cancel
        #}

        set -g word-separators ' "''()[]{}'
		# Use 256 colors
		set -g default-terminal "tmux-256color"

		# Forward OSC 8 hyperlinks to the outer terminal
		set -ga terminal-features '*:hyperlinks'

		# Copy-mode yanks go to the Windows clipboard (OSC 52)
		set -g set-clipboard on

		# Forward focus in/out to panes for TUIs
		set -g focus-events on

		# Increase history scrollback
		set -g history-limit 10000

		# Improve status bar readability
		#set -g status-bg black
		#set -g status-fg white

		# Reload tmux config with prefix + r
		bind r source-file ~/.tmux.conf \; display "Config Reloaded."

		# Split panes more conveniently
		bind / split-window -h  # Vertical split
		bind - split-window -v  # Horizontal split

		# Switch panes with Alt + arrow keys
		bind -n M-Left select-pane -L
		bind -n M-Right select-pane -R
		bind -n M-Up select-pane -U
		bind -n M-Down select-pane -D

                # Same command all panes
		bind a setw synchronize-panes

		# Vim-style pane navigation
		setw -g mode-keys vi

		# Start counting pane and window number at 1
		set -g base-index 1
		setw -g pane-base-index 1

		#set -g pane-border-status top
		#set -g pane-border-format "#{pane_title}"

		# Initialize TPM
		set -g @plugin 'tmux-plugins/tpm'
		set -g @plugin 'jaclu/tmux-power-zoom'
		set -g @plugin 'tmux-plugins/tmux-yank' 
        set -g @plugin 'tmux-plugins/tmux-resurrect'
        set -g @plugin 'tmux-plugins/tmux-continuum'

		set -g @continuum-restore 'off'
        set -g @resurrect-processes ':all:'


        set -g status-right-length 80
		#set -g status-right '#(/home/benito/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}"#(tmux display-message -p "#{pane_title}" | sed -E "s/^(.*) - (.*) \| cli$/\1 - \2/; s/^(.*) - (.*)$/\1 - \2/")" %H:%M %d-%b-%y'


        set -g status-right '#(/home/benito/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)#{?window_bigger,[#{window_offset_x},#{window_offset_y}] ,}"#{s/ \| cli[a-z]*$//;s/^(▶|⏸) (.*) - (.*)$/\1 \3 - \2/:pane_title}" %H:%M %d-%b-%y'


set -sg escape-time 50


        # Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
		run '~/.tmux/plugins/tpm/tpm'

